name: Auto Optimize Images to WebP

on:
  push:
    paths:
      - 'assets/**'
      - 'projects/**'
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.png'
  workflow_dispatch:

jobs:
  optimize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Image Optimizer Script
        run: node scripts/convert-images.js

      - name: Commit and Push Optimized Images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Auto-optimize images to WebP [skip ci]" || exit 0
          git push
